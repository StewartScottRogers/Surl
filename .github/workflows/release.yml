# Publishes the native-AOT `surl` binary for every supported platform.
#
#   * Pushing a tag `v*` (e.g. v0.1.0) builds all six packages and attaches them, with a
#     SHA256SUMS file, to a GitHub release of that name. A tag with a hyphen
#     (v0.1.0-preview.1) makes a pre-release. Tags and releases need Stewart's say-so
#     (CLAUDE.md), so this workflow never creates a tag itself.
#   * Running it by hand (workflow_dispatch) builds the same packages and uploads them as
#     workflow artifacts only - a dry run that publishes nothing. A pull request that
#     touches this file, the executable or the shared build settings gets the same dry run.
#
# Native AOT cannot cross-compile between operating systems, so each package is built on
# a runner of its own OS. Linux builds on Ubuntu 22.04 so the binary runs on glibc 2.35
# and newer. DOWNLOAD.md, install.sh and install.ps1 rely on the package names below;
# keep the four in step. DOWNLOAD.md links to one version by tag, because
# releases/latest skips pre-releases: point it at each new release's tag.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Surl.Console/**
      - Directory.Build.props
      - global.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest,    archive: zip }
          - { rid: win-arm64,   runner: windows-11-arm,    archive: zip }
          - { rid: linux-x64,   runner: ubuntu-22.04,      archive: tar.gz }
          - { rid: linux-arm64, runner: ubuntu-22.04-arm,  archive: tar.gz }
          - { rid: osx-x64,     runner: macos-latest,      archive: tar.gz }
          - { rid: osx-arm64,   runner: macos-latest,      archive: tar.gz }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PACKAGE: surl-${{ matrix.rid }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # The AOT linker finds MSVC through vswhere, which must be on PATH (Surl.Console.csproj).
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: bash
        run: dotnet publish Surl.Console -c Release -r ${{ matrix.rid }} -p:Version="$VERSION" -o publish

      - name: Smoke test
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          # The binary must start; until Phase 1 lands it exits 2 (SurlExitCode.FailedInit).
          set +e
          ./publish/surl --version
          code=$?
          set -e
          echo "exit code $code"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]

      - name: Package
        shell: bash
        run: |
          mkdir package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp publish/surl.exe package/
            cp LICENSE.txt README.md package/
            (cd package && 7z a "../$PACKAGE" surl.exe LICENSE.txt README.md)
          else
            cp publish/surl package/
            cp LICENSE.txt README.md package/
            tar -czf "$PACKAGE" -C package surl LICENSE.txt README.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum surl-* > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
