# Phase 7: builds the Curl port at the commit CurlPortBuilds.json pins on linux-x64, osx-arm64
# and win-x64, publishes it twice, and compares both hashes with each other and with the pin
# (ADR-0089 Amendment 8, BL-1304). The linux-x64 test job is BL-1307, the osx-arm64 one BL-1308.
#
# THIS WORKFLOW GATES NOTHING. It is not part of ci.yml, runs only on workflow_dispatch and a
# weekly schedule (never on a push or pull request), is not a required check, and
# RunDarkFactory.ps1 reads only the "CI" workflow for its merge. A red run is a build problem
# or a finding to read, not a Surl failure (ADR-0003 decision 6). The port is never an oracle.
name: curl-port-phase-7

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:17 UTC.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: curl-port-phase-7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-curl-port:
    name: Build the Curl port (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-latest, platform: osx-arm64 }
          - { os: windows-latest, platform: win-x64 }
    steps:
      - uses: actions/checkout@v4

      # The one commit every platform builds is the one the win-x64 curl entry pins. A platform's
      # own entry, once pinned, supplies the publish command and the expected SHA-256.
      - name: Read the Curl port pin
        id: pin
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $builds = @((Get-Content -Raw CurlPortBuilds.json | ConvertFrom-Json).builds |
            Where-Object { -not $_.kind -or $_.kind -eq 'curl' })
          $own = @($builds | Where-Object { $_.platform -eq $env:PLATFORM })
          $reference = @($builds | Where-Object { $_.platform -eq 'win-x64' })
          if ($reference.Count -ne 1) {
            Write-Output "::error::CurlPortBuilds.json must pin exactly one win-x64 curl entry; it pins $($reference.Count)."
            exit 1
          }
          $commit = if ($own.Count -eq 1) { $own[0].commit } else { $reference[0].commit }
          $command = if ($own.Count -eq 1) { $own[0].publishCommand } else { $reference[0].publishCommand -replace '-r win-x64', "-r $env:PLATFORM" }
          # The pin's output folder is a path on the machine that pinned it; each publish here gets its own.
          $command = $command -replace '\s-o\s+("[^"]*"|\S+)', ''
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "command=$command" >> $env:GITHUB_OUTPUT
          # A native-AOT publish is reproducible on one machine and path but not across them (ADR-0175),
          # so an entry pinned on a developer machine may add ciSha256, the hash the CI runner produces.
          # ADR-0175 Amendment 2: "ciHashStable": false compares only the two publishes of this run,
          # because the runner image's toolchain moves the hash between runs.
          $stable = ($own.Count -eq 1) -and ($own[0].ciHashStable -ne $false -or $env:PLATFORM -eq 'linux-x64')
          "stable=$($stable.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $expected = if (-not $stable) { '' } elseif ($own[0].ciSha256) { $own[0].ciSha256 } else { $own[0].sha256 }
          "expected=$expected" >> $env:GITHUB_OUTPUT
          Write-Output "Building the Curl port at $commit for $env:PLATFORM: $command"

      - name: Check out the Curl port at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: StewartScottRogers/Curl
          ref: ${{ steps.pin.outputs.commit }}
          path: curl-port

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: curl-port/global.json

      - name: Publish the Curl port twice and compare the hashes
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          PUBLISH_COMMAND: ${{ steps.pin.outputs.command }}
          EXPECTED_SHA256: ${{ steps.pin.outputs.expected }}
          COMMIT: ${{ steps.pin.outputs.commit }}
          HASH_STABLE: ${{ steps.pin.outputs.stable }}
        run: |
          $executable = if ($env:PLATFORM -eq 'win-x64') { 'curl.exe' } else { 'curl' }
          $hashes = @()
          foreach ($run in 'one', 'two') {
            $folder = Join-Path $env:RUNNER_TEMP "curl-port-publish-$run"
            Push-Location curl-port
            try {
              Invoke-Expression "$env:PUBLISH_COMMAND -o `"$folder`""
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::Publish $run failed."; exit 1 }
            } finally { Pop-Location }
            $file = Join-Path $folder $executable
            if (-not (Test-Path -LiteralPath $file)) { Write-Output "::error::Publish $run produced no $executable."; exit 1 }
            $hashes += (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            Write-Output "Publish ${run}: $($hashes[-1])"
          }
          if ($hashes[0] -ne $hashes[1]) {
            Write-Output "::error::Two publishes of $env:COMMIT for $env:PLATFORM differ ($($hashes[0]) and $($hashes[1])); the publish is not reproducible, so no hash can be pinned (ADR-0089 Amendment 8)."
            exit 1
          }
          if ($env:HASH_STABLE -eq 'false' -and $env:PLATFORM -in 'win-x64', 'osx-arm64') {
            Write-Output "The $env:PLATFORM publish is reproducible within this run ($($hashes[0])); its pin is not compared across runs (ADR-0175 Amendment 2)."
            exit 0
          }
          if (-not $env:EXPECTED_SHA256) {
            Write-Output "::warning::CurlPortBuilds.json has no $env:PLATFORM curl pin yet. The reproducible hash is $($hashes[0]); pin it for commit $env:COMMIT."
            exit 0
          }
          if ($hashes[0] -ne $env:EXPECTED_SHA256) {
            Write-Output "::error::The $env:PLATFORM publish hashes to $($hashes[0]), but CurlPortBuilds.json pins $env:EXPECTED_SHA256."
            exit 1
          }
          Write-Output "The $env:PLATFORM publish matches the pin $env:EXPECTED_SHA256."

  # BL-1307: runs the Phase 7 families on linux-x64 (ADR-0089 decision 8, Amendment 8). The port is
  # published to the path CurlPortBuilds.json pins for linux-x64 and the tests verify its SHA-256
  # against the pin before running it; the upstream curl builds, with the OpenLDAP one, come from
  # the same action ci.yml uses, so the 47 OpenLdap_ cases run instead of being Inconclusive.
  # The tests are Phase 7 findings, not Surl gates: the job continues on a failing test run and
  # uploads the results, so a finding never turns the workflow into a Surl failure.
  test-curl-port-linux-x64:
    name: Phase 7 families and OpenLdap_ cases (linux-x64)
    needs: build-curl-port
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check out the Curl port at the pinned commit
        id: port
        shell: pwsh
        run: |
          $pin = @((Get-Content -Raw CurlPortBuilds.json | ConvertFrom-Json).builds |
            Where-Object { $_.platform -eq 'linux-x64' -and (-not $_.kind -or $_.kind -eq 'curl') })
          if ($pin.Count -ne 1) { Write-Output "::error::CurlPortBuilds.json must pin exactly one linux-x64 curl entry."; exit 1 }
          "commit=$($pin[0].commit)" >> $env:GITHUB_OUTPUT
          "command=$($pin[0].publishCommand -replace '%HOME%', $env:HOME)" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: StewartScottRogers/Curl
          ref: ${{ steps.port.outputs.commit }}
          path: curl-port

      # BL-1339: the build job publishes into a temporary folder (the pin's -o removed) and its hash
      # matches the pin; publishing straight into the pinned folder hashed 048AAEE0... instead of the
      # pinned DF507F32..., so this job publishes the way the build job does and copies the folder.
      - name: Publish the Curl port to its pinned path
        shell: pwsh
        env:
          PUBLISH_COMMAND: ${{ steps.port.outputs.command }}
          COMMIT: ${{ steps.port.outputs.commit }}
        run: |
          $command = $env:PUBLISH_COMMAND -replace '\s-o\s+("[^"]*"|\S+)', ''
          $folder = Join-Path $env:RUNNER_TEMP 'curl-port-publish-one'
          Push-Location curl-port
          try {
            Invoke-Expression "$command -o `"$folder`""
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::The Curl port publish failed."; exit 1 }
          } finally { Pop-Location }
          $pinned = Join-Path $env:HOME ".local/share/surl/curl-port/$env:COMMIT"
          New-Item -ItemType Directory -Force -Path $pinned | Out-Null
          Copy-Item -Path (Join-Path $folder '*') -Destination $pinned -Recurse -Force
          chmod +x (Join-Path $pinned 'curl')
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $pinned 'curl')).Hash
          Write-Output "Published curl SHA-256: $hash"
          # BL-1340 (ADR-0175 Amendment 3): the pin is ciHashStable:false, so the tests accept this file's hash.
          "SURL_CURL_PORT_CI_SHA256=$hash" >> $env:GITHUB_ENV

      # After the port publish: in run 44012635963 this step came first and the published port
      # hashed differently from the build job's, so the toolchain it installs is the suspect.
      - name: Obtain the pinned upstream curl and the OpenLDAP build
        uses: ./.github/actions/upstream-curl
        with:
          platform: linux-x64
          asset: curl-linux-x86_64-musl-8.21.0.tar.xz
          openldap: 'true'

      - name: Build Surl
        run: dotnet build Conformance/Surl.Conformance.UnitTests -c Release

      - name: Phase 7 families and OpenLdap_ cases
        continue-on-error: true
        run: dotnet test Conformance/Surl.Conformance.UnitTests -c Release --no-build --filter "FullyQualifiedName~CurlPortBesideUpstreamCurl" --logger trx --logger "console;verbosity=normal" --results-directory "${{ runner.temp }}/phase-7-results"

      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-linux-x64-results
          path: ${{ runner.temp }}/phase-7-results

  # BL-1308: runs the Phase 7 families on osx-arm64 (ADR-0089 decision 8, Amendment 8). Same shape
  # as the linux-x64 job; macOS has no OpenLDAP build, so the OpenLdap_ cases stay Inconclusive there.
  test-curl-port-osx-arm64:
    name: Phase 7 families (osx-arm64)
    needs: build-curl-port
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Obtain the pinned upstream curl
        uses: ./.github/actions/upstream-curl
        with:
          platform: osx-arm64
          asset: curl-macos-arm64-8.21.0.tar.xz

      - name: Check out the Curl port at the pinned commit
        id: port
        shell: pwsh
        run: |
          $pin = @((Get-Content -Raw CurlPortBuilds.json | ConvertFrom-Json).builds |
            Where-Object { $_.platform -eq 'osx-arm64' -and (-not $_.kind -or $_.kind -eq 'curl') })
          if ($pin.Count -ne 1) { Write-Output "::error::CurlPortBuilds.json must pin exactly one osx-arm64 curl entry."; exit 1 }
          "commit=$($pin[0].commit)" >> $env:GITHUB_OUTPUT
          "command=$($pin[0].publishCommand -replace '%HOME%', $env:HOME)" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: StewartScottRogers/Curl
          ref: ${{ steps.port.outputs.commit }}
          path: curl-port

      # BL-1622: the BL-1339 / BL-1340 treatment, now on osx-arm64. Publishing straight into the pinned
      # folder hashed 51892DFE... instead of the pinned B5B48DC7..., so 357 cases threw
      # UnpinnedCurlPortClientException; this job publishes into a temporary folder (the pin's -o
      # removed), copies it to the pinned path and hands the tests the file's hash, as linux-x64 does.
      - name: Publish the Curl port to its pinned path
        shell: pwsh
        env:
          PUBLISH_COMMAND: ${{ steps.port.outputs.command }}
          COMMIT: ${{ steps.port.outputs.commit }}
        run: |
          $command = $env:PUBLISH_COMMAND -replace '\s-o\s+("[^"]*"|\S+)', ''
          $folder = Join-Path $env:RUNNER_TEMP 'curl-port-publish-one'
          Push-Location curl-port
          try {
            Invoke-Expression "$command -o `"$folder`""
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::The Curl port publish failed."; exit 1 }
          } finally { Pop-Location }
          $pinned = Join-Path $env:HOME ".local/share/surl/curl-port/$env:COMMIT"
          New-Item -ItemType Directory -Force -Path $pinned | Out-Null
          Copy-Item -Path (Join-Path $folder '*') -Destination $pinned -Recurse -Force
          chmod +x (Join-Path $pinned 'curl')
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $pinned 'curl')).Hash
          Write-Output "Published curl SHA-256: $hash"
          # BL-1340 (ADR-0175 Amendment 3): the pin is ciHashStable:false, so the tests accept this file's hash.
          "SURL_CURL_PORT_CI_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Build Surl
        run: dotnet build Conformance/Surl.Conformance.UnitTests -c Release

      - name: Phase 7 families
        continue-on-error: true
        run: dotnet test Conformance/Surl.Conformance.UnitTests -c Release --no-build --filter "FullyQualifiedName~CurlPortBesideUpstreamCurl" --logger trx --logger "console;verbosity=normal" --results-directory "${{ runner.temp }}/phase-7-results"

      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-osx-arm64-results
          path: ${{ runner.temp }}/phase-7-results
