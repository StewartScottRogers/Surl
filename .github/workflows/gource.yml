# Keeps the README's showcase on the `gource` branch, served by GitHub Pages at
# https://stewartscottrogers.github.io/Surl/: a Gource video of Surl's history (an 8K
# adaptive stream with a full-screen viewer page, and the GIF the README shows) and the
# code coverage report (coverage/index.html, and coverage/badge.svg for the README), and
# the live task board page (board/index.html, served at .../Surl/board/; ADR-0029).
#
# Four jobs:
#   * decide     - whether this run renders (below);
#   * coverage   - on Windows, where the quality gates are measured: Measure-CodeQuality.ps1
#                  measures, .github/coverage/make-coverage-report.cs renders the page and
#                  the badge, and the result is committed onto the gource branch;
#   * render     - the video. It waits for coverage, then force-pushes a new single-commit
#                  gource branch that carries the coverage/ and board/ folders over. The
#                  force push is leased on the branch commit those folders were read from,
#                  so a coverage or board commit that lands meanwhile is never dropped: the
#                  push is refused, and the job reads the folders again and retries;
#   * board-page - on every run, never gated on decide: when .github/board/site/index.html
#                  is in this commit and differs from the gource branch's board/index.html,
#                  it commits the page there as board/index.html, without force. The page
#                  fetches the task tree and the board branch's status.json itself, so it
#                  only needs publishing when its source changes.
#
# Concurrency. GitHub keeps at most one running and one pending job per concurrency group,
# and a newly queued job cancels the pending one. So each writer has a group of its own,
# and nothing that will not write ever enters one:
#   * decide is read-only and in no group, so it runs at once on every run;
#   * coverage is in gource-coverage and render in gource-video, each only when this run
#     renders (otherwise in a group of the run's own). One coverage and one render run at
#     a time; a pending render is replaced only by a newer render, which renders instead,
#     so a stream of pushes can never starve one;
#   * board-page is in gource-board, so the page goes up within minutes instead of
#     waiting behind a render.
# The writers that can overlap - coverage, render and board-page - never lose each
# other's commits: coverage and board-page push without force and retry on refusal, and
# render's force push is leased (above).
#
# A push run also does not render while another run's coverage or render job is queued
# or running: that run is about to render, and commits it misses are rendered by the next
# push once the 30 minutes below have passed, or by the hourly run.
#
# An 8K render takes the better part of an hour on a runner, hence the long timeout.
#
# When it renders:
#   * hourly (from master, once this file is merged), if any branch has new commits;
#   * on a push to any branch, if any branch has new commits, the last render is at least
#     30 minutes old and no other run's coverage or render job is queued or running;
#   * at least once a day regardless;
#   * whenever it is run by hand (workflow_dispatch).
#   * never for a push to `board`: that branch holds only the dark factory's lane
#     heartbeats, so it starts no run and its commits do not count as new commits.
#
# The `gource` branch holds one commit - the latest render - and is force-pushed on each
# render so old videos never accumulate in the repository. That force push, to that
# branch only, is standing-authorized (CLAUDE.md).
name: Gource

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches-ignore: [gource, board]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write

jobs:
  # Read-only, so in no concurrency group: it must never wait behind, or cancel, a writer.
  decide:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.decide.outputs.render }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to render
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          fp=$(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin \
                 | grep -v -E '^refs/remotes/origin/(gource|board|HEAD) ' | sha1sum | cut -c1-40)
          prev_fp=$(git show origin/gource:fingerprint.txt 2>/dev/null || true)
          prev_at=$(git show origin/gource:rendered-at.txt 2>/dev/null || echo 0)
          age=$(( $(date +%s) - prev_at ))
          render=no
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then render=yes
          elif [ -z "$prev_fp" ] || [ "$age" -ge 86400 ]; then render=yes
          elif [ "$fp" != "$prev_fp" ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$age" -ge 1800 ]; then render=yes; fi
          fi
          # A push does not render while another run's coverage or render job is queued or
          # running. If the runs cannot be listed, it renders as it would have anyway.
          if [ "$render" = yes ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            busy=
            if runs=$(for s in queued in_progress pending waiting requested; do
                        gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gource.yml/runs?status=$s&per_page=100" \
                          --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id" || exit 1
                      done); then
              for id in $(echo "$runs" | sort -u); do
                jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                         --jq '.jobs[] | select((.name == "coverage" or .name == "render") and .status != "completed") | .name' \
                       || true)
                if [ -n "$jobs" ]; then busy="run $id ($(echo $jobs))"; break; fi
              done
            else
              echo '::warning::could not list this workflow'"'"'s runs; deciding without them'
            fi
            if [ -n "$busy" ]; then
              echo "a render is already on its way in $busy; this push does not queue another"
              render=no
            fi
          fi
          echo "fingerprint=$fp previous=${prev_fp:-none} age=${age}s event=$GITHUB_EVENT_NAME render=$render"
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

  coverage:
    needs: decide
    if: needs.decide.outputs.render == 'yes'
    runs-on: windows-latest
    timeout-minutes: 60
    # The shared group only when this run renders, so a run that will not render never
    # queues a job that could cancel a pending one there.
    concurrency:
      group: ${{ needs.decide.outputs.render == 'yes' && 'gource-coverage' || format('gource-coverage-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The runner's preinstalled SDK when it satisfies global.json; otherwise Microsoft's
      # install script fetches that exact SDK (no marketplace action).
      - name: Install the .NET SDK
        run: |
          dotnet --version 2>$null
          if ($LASTEXITCODE -ne 0) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -JsonFile global.json -InstallDir "$env:USERPROFILE\.dotnet"
            "$env:USERPROFILE\.dotnet" >> $env:GITHUB_PATH
          }

      # Measure-CodeQuality.ps1 exits 1 when a member is outside a gate. The report shows
      # those, so that is not a failure here; writing no JSON at all is.
      - name: Measure coverage
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Measure-CodeQuality.ps1 -JsonPath "$env:RUNNER_TEMP\coverage.json"
          if (-not (Test-Path "$env:RUNNER_TEMP\coverage.json")) { throw 'Measure-CodeQuality.ps1 wrote no JSON' }
          exit 0

      - name: Render the report
        run: dotnet run --file .github/coverage/make-coverage-report.cs -- "$env:RUNNER_TEMP\coverage.json" "$env:RUNNER_TEMP\coverage" $env:GITHUB_SHA

      # Committed on top of the gource branch, without force; the render job carries the
      # folder into its own force-pushed commit. When the branch does not exist yet (a new
      # repository, or one whose branch was deleted), this starts it as an orphan branch
      # holding only coverage/, and the render job replaces it with a full render. The push
      # is never forced, so if a render created the branch in the meantime, the push is
      # refused and the next try commits on top of it.
      - name: Publish to the gource branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $url = "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          foreach ($try in 1..3) {
            $dir = Join-Path $env:RUNNER_TEMP "site-$try"
            git ls-remote --exit-code --heads $url gource | Out-Null
            if ($LASTEXITCODE -eq 0) {
              # Sparse and blob-less: the branch also holds ~900 MB of video this job never needs.
              git clone -q --depth 1 --filter=blob:none --sparse --branch gource $url $dir
              if ($LASTEXITCODE -ne 0) { throw 'could not clone the gource branch' }
              git -C $dir sparse-checkout set coverage
            } elseif ($LASTEXITCODE -eq 2) {
              Write-Host 'no gource branch yet: starting it as an orphan branch'
              git init -q -b gource $dir
              git -C $dir remote add origin $url
            } else {
              throw 'could not list the branches of origin'
            }
            $target = Join-Path $dir 'coverage'
            if (Test-Path $target) { Get-ChildItem $target | ForEach-Object { $_.Delete() } }
            else { New-Item -ItemType Directory $target | Out-Null }
            Copy-Item "$env:RUNNER_TEMP\coverage\*" $target
            git -C $dir config user.name 'github-actions[bot]'
            git -C $dir config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C $dir add coverage
            git -C $dir commit -q -m "chore(coverage): report $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mmZ'))"
            git -C $dir push -q origin gource
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw 'push to gource kept being refused'

      # A push made with GITHUB_TOKEN does not start a Pages build by itself; ask for one.
      # Pages is a repository setting this workflow cannot switch on (it needs an admin),
      # so while the repository has no Pages site this warns rather than fails: the branch
      # is published either way.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::GitHub Pages is not enabled for this repository (Settings > Pages, source: the gource branch); the gource branch is published but not served.'
            exit 0
          }
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/pages/builds" --silent

  render:
    needs: [decide, coverage]
    # Renders even when the coverage job failed: the video does not depend on it. Not
    # always(): a cancelled run must be able to stop a render that takes hours. Not when
    # coverage was cancelled either: a newer run queued in gource-coverage replaced it and
    # renders instead. The shared group only when it renders, as in the coverage job; a
    # pending render there is replaced only by a newer run's render.
    if: ${{ !cancelled() && needs.decide.outputs.render == 'yes' && needs.coverage.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: ${{ needs.decide.outputs.render == 'yes' && needs.coverage.result != 'cancelled' && 'gource-video' || format('gource-video-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gource and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gource ffmpeg xvfb

      # render.sh's generators are C# file-based apps run with `dotnet run --file`, so the
      # SDK global.json names must be present. The runner's preinstalled SDK is used when it
      # satisfies global.json; otherwise Microsoft's install script fetches that exact SDK
      # (no marketplace action: only actions/checkout is allowed here).
      - name: Install the .NET SDK
        run: |
          if dotnet --version > /dev/null 2>&1; then
            echo "preinstalled .NET SDK $(dotnet --version) satisfies global.json"
          else
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
            bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet"
            echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          fi

      # Memory is logged once a minute: a runner out of memory kills the render with no
      # message of its own (exit code 143), and this is what shows that it was memory.
      - name: Render
        run: |
          echo "runner: $(nproc) cores, $(free -m | awk 'NR==2 {print $2}') MB memory, $(free -m | awk 'NR==3 {print $2}') MB swap"
          ( while sleep 60; do
              echo "memory: $(free -m | awk 'NR==2 {print $3 " of " $2 " MB used"}; NR==3 {print ", swap " $3 " MB"}' | tr -d '\n')," \
                   "largest: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s %d MB; ", $2, $1 / 1024}')"
            done ) &
          bash .github/gource/render.sh "$RUNNER_TEMP/gource"

      - name: Publish to the gource branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINGERPRINT: ${{ needs.decide.outputs.fingerprint }}
        run: |
          cd "$RUNNER_TEMP/gource"
          echo "$FINGERPRINT" > fingerprint.txt
          date +%s > rendered-at.txt
          printf '%s\n' '# gource' '' \
            'The README showcase of Surl: the 8K Gource viewer, the code coverage report and' \
            'the live task board page (board/), served by GitHub Pages at' \
            'https://stewartscottrogers.github.io/Surl/ (the board at .../Surl/board/), and' \
            'the GIF and coverage badge the README shows.' \
            'Generated by .github/workflows/gource.yml and replaced on every render; do not edit.' > README.md
          cp "$GITHUB_WORKSPACE/.github/gource/site/index.html" index.html
          touch .nojekyll
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The coverage job and board-page may commit onto the branch while this job runs.
          # So the folders they own are read from one branch commit, and the force push is
          # leased on that commit: if the branch has moved since, the push is refused and
          # the next try reads the folders again from the new commit.
          for try in 1 2 3 4 5; do
            base=$(git ls-remote "$url" refs/heads/gource | cut -f1)
            # Keep the coverage report the coverage job committed onto the branch: its three
            # files, fetched one by one rather than the whole branch and its video. Through
            # the contents API, which serves a private repository to GITHUB_TOKEN.
            rm -rf coverage board .git
            mkdir -p coverage board
            for f in index.html badge.svg coverage.json; do
              [ -n "$base" ] && GH_TOKEN="$GITHUB_TOKEN" gh api -H 'Accept: application/vnd.github.raw' \
                "repos/${GITHUB_REPOSITORY}/contents/coverage/$f?ref=$base" > "coverage/$f" || rm -f "coverage/$f"
            done
            # The board page: this commit's source when it has one, otherwise the copy already
            # on the branch (a scheduled run checks out master, which may not have it yet).
            if [ -f "$GITHUB_WORKSPACE/.github/board/site/index.html" ]; then
              cp "$GITHUB_WORKSPACE/.github/board/site/index.html" board/index.html
            else
              [ -n "$base" ] && GH_TOKEN="$GITHUB_TOKEN" gh api -H 'Accept: application/vnd.github.raw' \
                "repos/${GITHUB_REPOSITORY}/contents/board/index.html?ref=$base" > board/index.html || rm -f board/index.html
            fi
            extra=$( [ -f coverage/index.html ] && echo coverage || true )
            [ -f board/index.html ] && extra="$extra board"
            git init -q -b gource
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html .nojekyll hls gource.mp4 gource.gif still-8k.jpg poster.jpg stats.json \
              fingerprint.txt rendered-at.txt README.md $extra
            git commit -q -m "chore(gource): render $(date -u +%Y-%m-%dT%H:%MZ)"
            # An empty lease means the branch must still not exist.
            if git push -q --force-with-lease="refs/heads/gource:$base" "$url" HEAD:refs/heads/gource; then
              exit 0
            fi
            echo "the gource branch moved from ${base:-nothing} while publishing; reading it again"
          done
          echo 'push to gource kept being refused'
          exit 1

      # A push made with GITHUB_TOKEN does not start a Pages build by itself; ask for one.
      # As in the coverage job, a repository without a Pages site gets a warning, not a failure.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2> /dev/null; then
            echo '::warning::GitHub Pages is not enabled for this repository (Settings > Pages, source: the gource branch); the gource branch is published but not served.'
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent

  # The live task board page, published on every run and never gated on `decide`: it is
  # one small file and must not wait behind an 8K render. It commits onto the gource
  # branch without force, like the coverage job, and only when the page changed. When the
  # branch does not exist yet, it starts it as an orphan branch holding only board/, as the
  # coverage job does, and the next render carries the page into its own commit.
  board-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gource-board
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/board/site

      - name: Publish to the gource branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source="$GITHUB_WORKSPACE/.github/board/site/index.html"
          if [ ! -f "$source" ]; then
            echo "no $source in this commit; nothing to publish"
            exit 0
          fi
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for try in 1 2 3; do
            dir="$RUNNER_TEMP/board-$try"
            status=0
            git ls-remote --exit-code --heads "$url" gource > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              # Sparse and blob-less: the branch also holds ~900 MB of video this job never needs.
              git clone -q --depth 1 --filter=blob:none --sparse --branch gource "$url" "$dir" \
                || { echo 'could not clone the gource branch'; exit 1; }
              git -C "$dir" sparse-checkout set board
            elif [ "$status" -eq 2 ]; then
              echo 'no gource branch yet: starting it as an orphan branch'
              git init -q -b gource "$dir"
              git -C "$dir" remote add origin "$url"
            else
              echo 'could not list the branches of origin'
              exit 1
            fi
            if cmp -s "$source" "$dir/board/index.html"; then
              echo 'board/index.html on gource is already this page; nothing to publish'
              exit 0
            fi
            mkdir -p "$dir/board"
            cp "$source" "$dir/board/index.html"
            git -C "$dir" config user.name 'github-actions[bot]'
            git -C "$dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$dir" add board/index.html
            git -C "$dir" commit -q -m "chore(board): page $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C "$dir" push -q origin gource; then
              echo "published=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'push to gource kept being refused'
          exit 1

      # A push made with GITHUB_TOKEN does not start a Pages build by itself; ask for one.
      # As in the coverage job, a repository without a Pages site gets a warning, not a failure.
      - name: Rebuild GitHub Pages
        if: steps.publish.outputs.published == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2> /dev/null; then
            echo '::warning::GitHub Pages is not enabled for this repository (Settings > Pages, source: the gource branch); the gource branch is published but not served.'
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
